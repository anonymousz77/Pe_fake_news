[pytest]
# Collect ONLY this project's tests.
#
# data/raw/ holds downloaded corpora, and some of them ship their own test
# suites -- mocheg's aux repo contains retrieval/test/test_scorer.py, which
# pytest happily tried to import, failed on a missing `transformers`, and
# turned into a collection error in our own run. Third-party code that we
# merely downloaded must never be able to break or influence our test results.
testpaths = tests
norecursedirs = data .venv .git docs scripts/__pycache__

addopts = --import-mode=prepend
