# Images that are byte-identical across two or more corpora.
#
# Generated by `python scripts/placeholders.py cross-corpus` from the processed
# layer: every sha256 that usable image references of records in two or more
# corpora point at. A shared photograph is genuine -- corpora built from the same
# fact-checked events share images -- and it is a leak the moment one corpus is
# used for training and the other for evaluation: the model is scored on pixels
# it has already seen. Registry matches are missing images and are not listed.
#
# Splits keep every such group in one split (scripts/split_all.py, live from the
# image index); this file is what a CROSS-corpus experiment drops, enforced by
# scripts/placeholders.assert_no_cross_corpus_leak(), keyed by processed record_id.

