# Files that decode and are not placeholders, but are provably NOT the image the dataset's
# authors used. A dataset that ships a fingerprint of its images (VERITE: a CLIP ViT-B/32
# embedding per row) lets us check the bytes we fetched against the bytes they had.
#
# Keyed by dataset AND sha256, never by hash alone: the same meme may be genuine content in
# another corpus. Not keyed by path: VERITE names its images true_N / false_N, so a path is a
# label. `rows` are record_ids (row indices); `file` is the label-free alias
# (scripts/records.verite_alias); the real path is in data/interim/verite_private_map.json
# (gitignored). A listed file has status `wrong_image` (scripts/images.py) and counts as missing.
#
# Threshold for review: cosine < 0.90 (1st percentile of same-image pairs 0.907). Every flagged file
# was inspected; only those visibly not the described image are listed. Kept, not listed: the
# image of row 602 (0.821, the right photo with a film-strip border) and the archive copy for
# row 266 (0.872, the right photo as a 480x270 thumbnail).
